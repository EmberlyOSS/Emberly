# Optional: S3-compatible storage with RustFS instead of the local disk volume.
#   docker compose -f compose.yaml -f compose.s3.yaml up -d
# S3_PUBLIC_ENDPOINT must be reachable from your users' machines (uploads from
# apps like Flicker go straight to it), e.g. https://s3.example.com behind your proxy.

services:
  emberly:
    environment:
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-emberly}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-emberly}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    depends_on:
      rustfs:
        condition: service_started

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-emberly}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - rustfs-data:/data

volumes:
  rustfs-data:
