[variables]
main_domain = "${domain}"
auth_secret = "${base64:32}"
postgres_password = "${password:32}"

[config]
[[config.domains]]
serviceName = "emberly"
port = 3000
host = "${main_domain}"

[config.env]
APP_URL = "https://${main_domain}"
AUTH_SECRET = "${auth_secret}"
POSTGRES_PASSWORD = "${postgres_password}"
