version: 2
projectIgnorePaths:
  - prisma/generated/**
  - .next/**
  - node_modules/**
  - scripts/**

issueRules:
  installScripts:
    action: error

  obfuscatedFiles:
    action: error

  malware:
    action: error

  newAuthor:
    action: error

  envVars:
    action: error

  typosquatSquatting:
    action: error

  deprecated:
    action: warn

  networkAccess:
    action: warn

  filesystemAccess:
    action: warn

  shellAccess:
    action: warn

  changedAuthor:
    action: warn

  noLicense:
    action: warn

  ambiguousClassifier:
    action: warn

  dynamicRequire:
    action: monitor

  evalUsage:
    action: monitor

  gitDependency:
    action: monitor

  unpublished:
    action: monitor
